  async function unlockMemories(event) {
    event.preventDefault();

    const input = $("#memoryInput");
    const button = $("#memorySubmit");
    const label = $("#memorySubmitText");
    const password = input ? input.value.trim() : "";

    if (!password) {
      setFieldError($("#fieldMemory"), $("#errMemory"), t("memEmpty"));
      shake($("#fieldMemory"));
      if (input) input.focus();
      return;
    }

    if (button) button.disabled = true;
    setButtonBusy(button, true);
    if (label) { label.removeAttribute("data-lang"); label.textContent = t("memUnlocking"); }

    const finish = () => {
      setButtonBusy(button, false);
      if (label) { label.setAttribute("data-lang", "memUnlock"); label.textContent = t("memUnlock"); }
    };

    /* Chế độ xem trước → đối chiếu cục bộ với mã đã lưu */
    if (useLocalMode()) {
      const localCode = store.get(STORAGE_KEYS.code);
      finish();
      if (localCode && password === memoryPasswordFor(localCode)) {
        revealGallery(true);
      } else {
        setFieldError($("#fieldMemory"), $("#errMemory"), t("memWrong"));
        shake($("#fieldMemory"));
      }
      return;
    }

    try {
      const data = await postToBackend({ action: "unlock", password: password });
      finish();
      if (data && data.status === "success") {
        setFieldError($("#fieldMemory"), $("#errMemory"), "");
        revealGallery(true);
      } else {
        setFieldError($("#fieldMemory"), $("#errMemory"), (data && data.message) ? data.message : t("memWrong"));
        shake($("#fieldMemory"));
      }
    } catch (err) {
      finish();
      setFieldError($("#fieldMemory"), $("#errMemory"), messageForError(err));
      shake($("#fieldMemory"));
    }
  }

  /* =====================================================================
     12 — ANIMATION SYSTEM
  ===================================================================== */

  function initReveal() {
    const items = $$("[data-rv]").filter((el) => !el.closest("#memoryGallery"));

    if (!("IntersectionObserver" in window) || prefersReducedMotion()) {
      items.forEach((el) => el.classList.add("rv-in"));
      return;
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add("rv-in");
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -6% 0px" });

    items.forEach((el) => observer.observe(el));
  }

  function initParallax() {
    if (prefersReducedMotion()) return;
    const layers = $$(".parallax");
    if (!layers.length) return;

    let ticking = false;

    const update = () => {
      const y = window.scrollY || window.pageYOffset;
      const enabled = window.innerWidth >= 900;
      layers.forEach((el) => {
        if (!enabled) { el.style.transform = ""; return; }
        const speed = parseFloat(el.getAttribute("data-speed")) || 0;
        el.style.transform = "translate3d(0," + (y * speed).toFixed(2) + "px,0)";
      });
      ticking = false;
    };

    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(update);
    };

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    update();
  }

  function initHeader() {
    const header = $("#siteHeader");
    if (!header) return;

    let lastY = 0;
    let ticking = false;

    const update = () => {
      const y = window.scrollY || window.pageYOffset;
      header.classList.toggle("is-solid", y > 90);
      lastY = y;
      ticking = false;
    };

    window.addEventListener("scroll", () => {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(update);
    }, { passive: true });
  }

  function initCursor() {
    if (!isFinePointer() || prefersReducedMotion()) return;

    const ring = $(".cursor");
    const dot  = $(".cursor-dot");
    if (!ring || !dot) return;

    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let ringX = mouseX, ringY = mouseY;

    document.addEventListener("mousemove", (event) => {
      mouseX = event.clientX;
      mouseY = event.clientY;
      dot.style.transform = "translate3d(" + (mouseX - 2) + "px," + (mouseY - 2) + "px,0)";
      ring.classList.add("is-on");
      dot.classList.add("is-on");
    }, { passive: true });

    document.addEventListener("mouseleave", () => {
      ring.classList.remove("is-on");
      dot.classList.remove("is-on");
    });

    const loop = () => {
      ringX += (mouseX - ringX) * 0.14;
      ringY += (mouseY - ringY) * 0.14;
      const size = ring.classList.contains("is-hover") ? 31 : 17;
      ring.style.transform = "translate3d(" + (ringX - size) + "px," + (ringY - size) + "px,0)";
      window.requestAnimationFrame(loop);
    };
    loop();

    const hoverTargets = "a, button, input, .polaroid, .img-hover";
    document.addEventListener("mouseover", (event) => {
      if (event.target.closest && event.target.closest(hoverTargets)) ring.classList.add("is-hover");
    });
    document.addEventListener("mouseout", (event) => {
      if (event.target.closest && event.target.closest(hoverTargets)) ring.classList.remove("is-hover");
    });
  }

  function initMagnetic() {
    if (!isFinePointer() || prefersReducedMotion()) return;

    $$(".magnetic").forEach((el) => {
      el.addEventListener("mousemove", (event) => {
        const rect = el.getBoundingClientRect();
        const x = event.clientX - rect.left - rect.width / 2;
        const y = event.clientY - rect.top - rect.height / 2;
        el.style.transform = "translate3d(" + (x * 0.12).toFixed(2) + "px," + (y * 0.18).toFixed(2) + "px,0)";
      });
      el.addEventListener("mouseleave", () => { el.style.transform = ""; });
    });
  }

  /* =====================================================================
     13 — INIT
  ===================================================================== */

  /* =====================================================================
     13 — TRẠNG THÁI ĐANG XỬ LÝ CHO NÚT
     Chèn một vòng xoay nhỏ vào nút, không đổi kích thước nút để layout
     không bị giật khi bấm.
  ===================================================================== */

  function setButtonBusy(button, busy) {
    if (!button) return;
    button.classList.toggle("is-busy", !!busy);
    button.disabled = !!busy;
    button.setAttribute("aria-busy", busy ? "true" : "false");

    const existing = button.querySelector(".btn__spin");
    if (busy && !existing) {
      const spin = document.createElement("span");
      spin.className = "btn__spin";
      spin.setAttribute("aria-hidden", "true");
      button.insertBefore(spin, button.firstChild);
    } else if (!busy && existing) {
      existing.remove();
    }
  }

  /* =====================================================================
     14 — NHẠC NỀN
     Phát qua trình phát nhúng chính thức của SoundCloud (SoundCloud lo phần
     bản quyền, mình không tải hay tự host file nhạc).
     Nhà trai và nhà gái nghe hai bài khác nhau, theo mã thiệp đã nhập.
  ===================================================================== */

  const music = { el: null, title: "", src: "", fade: null, everPlayed: false, volumeOk: null };

  function musicConfig() {
    return (WEDDING_CONFIG && WEDDING_CONFIG.music) || null;
  }

  /** Bài nhạc theo bên khách; không rõ bên thì dùng bài mặc định */
  function trackForSide() {
    const cfg = musicConfig();
    if (!cfg) return null;
    const side = currentSide() || cfg.fallback || "bride";
    return cfg[side] || cfg[cfg.fallback] || null;
  }

  function targetVolume() {
    const cfg = musicConfig();
    const v = cfg && typeof cfg.volume === "number" ? cfg.volume : 55;
    return Math.min(1, Math.max(0, v / 100));
  }

  /**
   * iOS không cho trang tự chỉnh âm lượng — gán vào là bị bỏ qua. Phải dò một
   * lần rồi nhớ lấy, nếu không sẽ có lúc để nhạc mắc kẹt ở mức 0 và khách tưởng
   * là hỏng.
   */
  function volumeIsWritable(el) {
    if (music.volumeOk !== null) return music.volumeOk;
    try {
      const before = el.volume;
      el.volume = 0.123;
      music.volumeOk = Math.abs(el.volume - 0.123) < 0.01;
      el.volume = before;
    } catch (err) {
      music.volumeOk = false;
    }
    return music.volumeOk;
  }

  /** Thẻ audio dùng chung, gắn sự kiện đúng một lần */
  function audioEl() {
    if (music.el) return music.el;
    const el = $("#bgAudio");
    if (!el) return null;

    music.el = el;
    el.loop = true;

    el.addEventListener("play",  renderMusicState);
    el.addEventListener("pause", renderMusicState);
    el.addEventListener("ended", renderMusicState);
    /* "playing" mới là lúc tiếng thật sự ra loa — "play" chỉ là lúc ra lệnh,
       file hỏng hay sai tên vẫn bắn "play" nên không dùng để kết luận được. */
    el.addEventListener("playing", () => { music.everPlayed = true; renderMusicState(); });

    /**
     * Lỗi tải nhạc (mạng chập chờn, khách đi thang máy…) KHÔNG được giấu đĩa đi,
     * vì giấu rồi thì khách không còn gì để bấm lại. Chỉ giấu khi ngay từ đầu đã
     * không phát nổi lần nào — lúc đó gần như chắc là sai tên file.
     */
    el.addEventListener("error", () => {
      if (music.everPlayed) renderMusicState();
      else hideMusicDock();
    });

    return el;
  }

  /** Vào ra êm, không đập thẳng vào tai khách */
  function fadeVolume(to, ms, done) {
    const el = music.el;
    if (!el) return;
    if (music.fade) { clearInterval(music.fade); music.fade = null; }

    if (!volumeIsWritable(el) || prefersReducedMotion() || !ms) {
      if (volumeIsWritable(el)) el.volume = to;
      if (done) done();
      return;
    }

    const from = el.volume;
    const started = Date.now();
    music.fade = window.setInterval(() => {
      const k = Math.min(1, (Date.now() - started) / ms);
      el.volume = Math.min(1, Math.max(0, from + (to - from) * k));
      if (k >= 1) {
        clearInterval(music.fade);
        music.fade = null;
        if (done) done();
      }
    }, 40);
  }

  /** Trạng thái luôn đọc thẳng từ thẻ audio — biến nhớ rất dễ lệch với thực tế */
  function isMusicPlaying() {
    const el = music.el;
    return !!(el && !el.paused && !el.ended);
  }

  function renderMusicState() {
    const playing = isMusicPlaying();
    const dock   = $("#musicDock");
    const button = $("#musicToggle");
    const label  = $("#musicToggleLabel");
    const title  = $("#musicTitle");
    if (dock)   dock.classList.toggle("is-playing", playing);
    if (button) button.setAttribute("aria-pressed", playing ? "true" : "false");
    if (label)  label.textContent = t(playing ? "musicPause" : "musicPlay");
    /* Đang phát thì khoe tên bài, chưa phát thì mời khách chạm */
    if (title)  title.textContent = playing ? (music.title || "") : t("musicTapToPlay");
  }

  function hideMusicDock() {
    const dock = $("#musicDock");
    if (dock) { dock.classList.remove("is-ready", "is-playing"); dock.setAttribute("hidden", "hidden"); }
  }

  async function playMusic() {
    const el = audioEl();
    if (!el) return false;

    /* Lần trước tải hỏng → nạp lại từ đầu, không thì bấm mấy cũng nằm im */
    if (el.error && music.src) {
      el.src = encodeURI(music.src);
      try { el.load(); } catch (err) {}
    }

    const target = targetVolume();
    const canFade = volumeIsWritable(el);

    try {
      if (canFade) el.volume = 0;
      await el.play();
      if (canFade) fadeVolume(target, 1500);
      return true;
    } catch (err) {
      /* Trình duyệt chặn → trả âm lượng về mức thường, để lần bấm sau không câm */
      if (canFade) el.volume = target;
      renderMusicState();
      return false;
    }
  }

  function pauseMusic() {
    const el = music.el;
    if (!el) return;
    if (!volumeIsWritable(el)) { try { el.pause(); } catch (err) {} return; }
    fadeVolume(0, 420, () => {
      try { el.pause(); } catch (err) {}
      el.volume = targetVolume();
    });
  }

  function toggleMusic() {
    if (!audioEl()) return;
    if (isMusicPlaying()) pauseMusic();
    else playMusic();
  }

  /**
   * Gọi ngay trong lúc khách vừa bấm "Mở thiệp" — đó là thao tác tay thật nên
   * trình duyệt điện thoại cho phép phát tiếng. Nhạc nằm cùng nơi với thiệp
   * (thư mục assets) nên không bị chặn như khi nhúng trình phát của trang khác.
   */
  async function startMusic(userGesture) {
    const cfg = musicConfig();
    if (!cfg) return;

    const track = trackForSide();
    if (!track || !track.src) return;

    const el = audioEl();
    if (!el) return;

    music.title = track.title || "";

    if (music.src !== track.src) {
      music.src = track.src;
      el.src = encodeURI(track.src);
    }

    const dock = $("#musicDock");
    if (dock) {
      dock.removeAttribute("hidden");
      requestAnimationFrame(() => dock.classList.add("is-ready"));
    }
    renderMusicState();

    if (userGesture && cfg.autoplayOnUnlock !== false) await playMusic();
  }

  /* =====================================================================
     15 — MÃ QR: LỚP CHE VÀ HIỆU ỨNG MỞ
     Mã bị che lúc đầu, khách chạm vào thì lớp che tan ra. Mở rồi là mở luôn,
     không đóng lại — khách còn phải giơ camera lên quét, đóng lại là phiền.
  ===================================================================== */

  const STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.6 6.3 5.1 10.8 12 12-6.9 1.2-11.4 5.7-12 12-.6-6.3-5.1-10.8-12-12C6.9 10.8 11.4 6.3 12 0z"/></svg>';

  /** Rắc một nắm sao lấp lánh trong khung mã, xong thì tự dọn */
  function burstSparkles(box) {
    if (prefersReducedMotion()) return;
    for (let i = 0; i < 12; i += 1) {
      const star = document.createElement("span");
      star.className = "qr-burst";
      star.setAttribute("aria-hidden", "true");
      star.style.setProperty("--x", (8 + Math.random() * 84) + "%");
      star.style.setProperty("--y", (8 + Math.random() * 84) + "%");
      star.style.setProperty("--dl", (Math.random() * 0.45).toFixed(2) + "s");
      star.style.setProperty("--sz", (9 + Math.random() * 10).toFixed(0) + "px");
      star.innerHTML = STAR_SVG;
      box.appendChild(star);
      window.setTimeout(() => { if (star.parentNode) star.remove(); }, 2200);
    }
  }

  function openQr(box) {
    if (!box || box.classList.contains("is-open")) return;
    box.classList.add("is-open");

    /* Mở mã là mở luôn cả số tài khoản — một cú chạm, không bắt khách chạm hai lần */
    const card = box.closest(".gift-card");
    if (card) card.classList.add("is-open");

    burstSparkles(box);

    const veil = box.querySelector(".qr-veil");
    if (veil) {
      veil.setAttribute("aria-hidden", "true");
      veil.setAttribute("tabindex", "-1");
    }
  }

  function initQrReveal() {
    $$(".gift-qr").forEach((box) => {
      const veil = box.querySelector(".qr-veil");
      if (veil) veil.addEventListener("click", () => openQr(box));

      /* Chạm vào chỗ số tài khoản đang mờ cũng mở, khỏi phải mò đúng ô mã */
      const card   = box.closest(".gift-card");
      const secret = card && card.querySelector(".gift-secret");
      if (secret) {
        secret.addEventListener("click", () => {
          if (!card.classList.contains("is-open")) openQr(box);
        });
      }
    });
  }

  /* =====================================================================
     16 — LẤP LÁNH QUANH NÚT
  ===================================================================== */

  function initSparkles() {
    $$(".btn, .copy-chip").forEach((el) => {
      if (el.querySelector(".spark")) return;
      for (let i = 1; i <= 3; i += 1) {
        const star = document.createElement("span");
        star.className = "spark spark--" + i;
        star.setAttribute("aria-hidden", "true");
        star.innerHTML = STAR_SVG;
        el.appendChild(star);
      }
    });
  }

  /* =====================================================================
     17 — CHỪA CHỖ CHO HEADER
     Trình duyệt trong Messenger/Zalo hay trả trang về không đúng đỉnh, làm
     dòng chữ đầu chui xuống dưới header. Đo chiều cao header thật rồi ghim
     lại, và ép cuộn về đỉnh vài nhịp cho chắc.
  ===================================================================== */

  function syncHeaderHeight() {
    const header = $("#siteHeader");
    if (!header) return;
    const h = Math.round(header.getBoundingClientRect().height) || 60;
    document.documentElement.style.setProperty("--header-h", h + "px");
  }

  function forceScrollTop() {
    const jump = () => { try { window.scrollTo(0, 0); } catch (err) {} };
    jump();
    requestAnimationFrame(jump);
    [80, 260, 600, 1000].forEach((ms) => window.setTimeout(jump, ms));
  }

  function initMusic() {
    const button = $("#musicToggle");
    if (button) button.addEventListener("click", toggleMusic);
    renderMusicState();
  }

  function init() {
    applyConfig();
    applyImages();
    applyGift();
    initLanguage();
    initLockScreen();
    initCountdown();
    initRSVP();
    initMemoryUnlock();
    initModals();
    initHeader();
    initMusic();
    initQrReveal();
    initSparkles();
    syncHeaderHeight();
    initCursor();
    initMagnetic();

    store.remove(STORAGE_KEYS.memory);      /* xoá cờ cũ nếu thiết bị từng mở album */
    state.guestGroup = store.get(STORAGE_KEYS.group);
    renderGuestGroupTag();
    renderMemoryVisibility();
    applySideTheme();
    applyGiftAccess();
    tryAutoUnlock().catch(() => {});
    logVisit();

    /* Trình duyệt tự nhớ vị trí cuộn cũ → tắt đi, không thì mở link từ
       Messenger hay bị rơi vào giữa trang */
    if ("scrollRestoration" in history) {
      try { history.scrollRestoration = "manual"; } catch (err) {}
    }
    window.addEventListener("resize", syncHeaderHeight);
    window.addEventListener("orientationchange", syncHeaderHeight);

    /* Dán mã vào thanh địa chỉ khi trang đang mở → mở luôn, không cần tải lại */
    window.addEventListener("hashchange", () => {
      if (!state.isUnlocked) tryAutoUnlock().catch(() => {});
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  /* Không để bất kỳ lỗi nào làm trắng màn hình */
  window.addEventListener("error", (event) => {
    if (window.console && console.warn) console.warn("[invitation]", event.message);
  });
})();
</script>

<!-- ============================ ĐĨA NHẠC ============================ -->
<div id="musicDock" class="music-dock" hidden>
  <button type="button" id="musicToggle" class="music-disc" aria-pressed="false">
    <span class="music-disc__art" aria-hidden="true"></span>
    <span class="music-disc__label" aria-hidden="true">H&amp;L</span>
    <span class="music-disc__cue" aria-hidden="true">
      <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </span>
    <span class="sr-only" id="musicToggleLabel"></span>
  </button>
  <div class="music-meta" aria-hidden="true">
    <span class="music-eq"><i></i><i></i><i></i></span>
    <span class="music-meta__title" id="musicTitle"></span>
  </div>
</div>
<audio id="bgAudio" loop preload="none" playsinline></audio>

</body>
